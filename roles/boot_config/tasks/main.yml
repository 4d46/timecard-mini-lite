---
- name: Deploy /boot/firmware/config.txt
  ansible.builtin.template:
    src: config.txt.j2
    dest: "{{ boot_firmware_path }}/config.txt"
    owner: root
    group: root
    mode: "0755"
    backup: true
  notify: Reboot host

# The TimeBeat community guide suggests adding console=ttyAMA0 to cmdline.txt.
# We instead REMOVE the serial console because ttyAMA0 is our GNSS UART — kernel boot
# messages on that port would corrupt GNSS data. SSH provides all access we need.
- name: Remove serial console from cmdline.txt (prevents kernel messages on GNSS UART)
  ansible.builtin.replace:
    path: "{{ boot_firmware_path }}/cmdline.txt"
    regexp: 'console=serial0,115200 '
    replace: ''
  notify: Reboot host

- name: Read current EEPROM config
  ansible.builtin.command: rpi-eeprom-config
  register: current_eeprom
  changed_when: false

- name: Write desired EEPROM config to temp file
  ansible.builtin.copy:
    content: "BOOT_ORDER={{ boot_order }}\n"
    dest: /tmp/eeprom_update.conf
    mode: "0644"
  when: boot_order not in current_eeprom.stdout

- name: Apply EEPROM boot order
  ansible.builtin.command: rpi-eeprom-config --apply /tmp/eeprom_update.conf
  when: boot_order not in current_eeprom.stdout
  notify: Reboot host
