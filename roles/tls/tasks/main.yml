---
- name: Create NTPsec SSL directory
  ansible.builtin.file:
    path: "{{ ntpsec_ssl_dir }}"
    state: directory
    owner: root
    group: ntpsec
    mode: "0750"

- name: Create certbot virtualenv with certbot-dns-gandi
  ansible.builtin.pip:
    name:
      - certbot
      - certbot-dns-gandi
      - "pyOpenSSL<24.0.0"
    virtualenv: /opt/certbot
    virtualenv_command: python3 -m venv
    state: present

- name: Symlink certbot into PATH
  ansible.builtin.file:
    src: /opt/certbot/bin/certbot
    dest: /usr/local/bin/certbot
    state: link

- name: Schedule certbot renewal
  ansible.builtin.cron:
    name: certbot-renew
    minute: "0"
    hour: "0,12"
    job: "/usr/local/bin/certbot renew -q"
    user: root

- name: Create /etc/letsencrypt directory
  ansible.builtin.file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write Gandi LiveDNS credentials file
  ansible.builtin.copy:
    content: "dns_gandi_token={{ vault_gandi_token }}\n"
    dest: "{{ certbot_gandi_ini }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Check if certificate already exists
  ansible.builtin.stat:
    path: "{{ certbot_cert_dir }}/fullchain.pem"
  register: cert_stat

- name: Issue Let's Encrypt certificate via Gandi DNS-01
  ansible.builtin.command: >
    certbot certonly
    --authenticator dns-gandi
    --dns-gandi-credentials {{ certbot_gandi_ini }}
    --register-unsafely-without-email
    --agree-tos
    --non-interactive
    -d {{ hostname_fqdn }}
  when: not cert_stat.stat.exists
  no_log: true
  register: certbot_result

- name: Deploy certbot renewal hook for NTPsec
  ansible.builtin.template:
    src: ntpsec-nts.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/ntpsec-nts
    owner: root
    group: root
    mode: "0755"

- name: Run deploy hook to copy initial certificates
  ansible.builtin.command: /etc/letsencrypt/renewal-hooks/deploy/ntpsec-nts
  when: not cert_stat.stat.exists or (certbot_result is defined and certbot_result.changed)
  notify: Restart ntpsec
